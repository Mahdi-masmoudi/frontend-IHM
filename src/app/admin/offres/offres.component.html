<div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
    <div class="flex items-center gap-3">
      <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-purple-50 text-purple-600">
        <i class="ti ti-briefcase text-xl"></i>
      </div>
      <div>
        <h4 class="text-lg font-semibold text-slate-900">Offres (admin)</h4>
        <p class="text-sm text-slate-500">Controle global des offres publiees.</p>
      </div>
    </div>
    <div class="relative w-full md:w-80">
      <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
        <i class="ti ti-search text-base"></i>
      </span>
      <input
        type="text"
        placeholder="Rechercher une offre..."
        class="w-full pl-9 pr-9 py-2 text-sm rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-purple-500/20 focus:border-purple-500 transition-all placeholder:text-slate-400 text-slate-700"
        [ngModel]="searchTerm()"
        (ngModelChange)="searchTerm.set($event)"
      />
      <button
        *ngIf="searchTerm()"
        (click)="searchTerm.set('')"
        class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600"
      >
        <i class="ti ti-x text-sm"></i>
      </button>
    </div>
  </div>
  <div class="overflow-x-auto">
    <table class="min-w-full text-sm">
      <thead class="text-left text-slate-500">
        <tr class="border-b border-slate-200">
          <th class="py-3 font-medium">Titre</th>
          <th class="py-3 font-medium">Localisation</th>
          <th class="py-3 font-medium">Statut</th>
          <th class="py-3 text-right font-medium">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let offre of filteredOffres()" class="border-b border-slate-100">
          <td class="py-3 font-semibold text-slate-900">{{ offre.titre }}</td>
          <td class="py-3 text-slate-600">{{ offre.localisation }}</td>
          <td class="py-3">
            <span class="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-700">{{ offre.statut }}</span>
          </td>
          <td class="py-3 text-right">
            <button
              class="inline-flex items-center justify-center rounded-lg border border-red-100 p-2 text-red-600 hover:border-red-400 hover:bg-red-50 transition-colors"
              (click)="confirmRemove(offre.idOffre, offre.titre)"
              title="Supprimer"
            >
              <i class="ti ti-trash text-base"></i>
            </button>
          </td>
        </tr>
        <tr *ngIf="filteredOffres().length === 0">
          <td colspan="4" class="py-6 text-center text-slate-400">Aucune offre trouvée</td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="mt-4 rounded-lg border border-red-100 bg-red-50 px-4 py-3 text-sm text-red-600" *ngIf="error()">
    {{ error() }}
  </div>
</div>

<!-- Custom Confirmation Modal -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm" *ngIf="showConfirmModal()">
  <div class="w-full max-w-md overflow-hidden rounded-2xl bg-white p-6 shadow-xl transition-all">
    <div class="flex items-center gap-4 mb-4">
      <div class="flex h-12 w-12 items-center justify-center rounded-full bg-red-50 text-red-600">
        <i class="ti ti-alert-triangle text-2xl"></i>
      </div>
      <div>
        <h3 class="text-lg font-bold text-slate-900">Confirmation de suppression</h3>
        <p class="text-sm text-slate-500">Cette action est irréversible.</p>
      </div>
    </div>
    <div class="text-sm text-slate-600 mb-6">
      {{ confirmMessage() }}
    </div>
    <div class="flex justify-end gap-3">
      <button
        class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50 transition-colors"
        (click)="cancelDelete()"
      >
        Annuler
      </button>
      <button
        class="rounded-xl bg-red-600 px-4 py-2 text-sm font-semibold text-white hover:bg-red-700 transition-colors"
        (click)="confirmDelete()"
      >
        Supprimer
      </button>
    </div>
  </div>
</div>
