<div class="auth-page">
  <div class="auth-container">
    <!-- Left Panel - Branding -->
    <div class="auth-branding">
      <div class="branding-content">
        <div class="brand-logo">
          <img src="/assets/images/logoIHM.png" alt="Emploi Connect Logo"
            style="max-height: 60px; width: auto; object-fit: contain; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.15)); margin-bottom: 16px;" />
        </div>
        <p class="brand-tagline">Votre tremplin professionnel intelligent en Tunisie</p>
        <div class="brand-features">
          <div class="feature">
            <i class="ti ti-search"></i>
            <span>Recherche d'emploi intelligente</span>
          </div>
          <div class="feature">
            <i class="ti ti-brain"></i>
            <span>Analyse CV par IA</span>
          </div>
          <div class="feature">
            <i class="ti ti-chart-bar"></i>
            <span>Suivi candidatures en temps réel</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Panel - Form -->
    <div class="auth-form-panel">
      <div class="auth-form-wrapper">
        <div class="form-header">
          <h2>Bienvenue</h2>
          <p>Connectez-vous à votre espace</p>
        </div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
          <!-- Email -->
          <div class="form-group">
            <label for="loginEmail">Adresse email</label>
            <div class="input-wrapper">
              <i class="ti ti-mail input-icon"></i>
              <input type="email" id="loginEmail" placeholder="votre@email.com" formControlName="email"
                [class.is-invalid]="form.get('email')?.invalid && form.get('email')?.touched" />
            </div>
            <div class="field-error" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
              <i class="ti ti-alert-circle"></i> Adresse email valide requise
            </div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label for="loginPassword">Mot de passe</label>
            <div class="input-wrapper">
              <i class="ti ti-lock input-icon"></i>
              <input [type]="showPassword() ? 'text' : 'password'" id="loginPassword" placeholder="Votre mot de passe"
                formControlName="motDePasse"
                [class.is-invalid]="form.get('motDePasse')?.invalid && form.get('motDePasse')?.touched" />
              <button type="button" class="toggle-password" (click)="togglePassword()">
                <i class="ti" [class.ti-eye]="!showPassword()" [class.ti-eye-off]="showPassword()"></i>
              </button>
            </div>
            <div class="field-error" *ngIf="form.get('motDePasse')?.invalid && form.get('motDePasse')?.touched">
              <i class="ti ti-alert-circle"></i> 8 caractères minimum requis
            </div>
          </div>

          <!-- Remember Me -->
          <div class="form-options">
            <label class="checkbox-wrapper">
              <input type="checkbox" [checked]="rememberMe()" (change)="rememberMe.set(!rememberMe())" />
              <span class="checkmark"></span>
              Se souvenir de moi
            </label>
          </div>

          <!-- Error Message -->
          <div class="error-banner" *ngIf="error()">
            <i class="ti ti-alert-triangle"></i>
            {{ error() }}
          </div>

          <!-- Submit -->
          <button class="btn-submit" type="submit" [disabled]="loading()">
            <span *ngIf="!loading()">Se connecter</span>
            <span *ngIf="loading()" class="loading-spinner">
              <i class="ti ti-loader-2 spin"></i> Connexion...
            </span>
          </button>

          <div class="form-footer">
            <p>Pas encore de compte ? <a routerLink="/register">Créer un compte</a></p>
          </div>
        </form>


      </div>
    </div>
  </div>
</div>
