<div class="job-form-page">
  <div class="job-form-container">
    <div class="form-card">
      <div class="form-header-premium">
        <div class="header-icon"><i class="ti ti-briefcase"></i></div>
        <div class="header-details">
          <h2>{{ offreId ? 'Modifier l\'Offre d\'Emploi' : 'Publier une Nouvelle Offre' }} 💼</h2>
          <p>Remplissez les détails ci-dessous pour publier votre opportunité auprès des talents tunisiens.</p>
        </div>
      </div>

      <form [formGroup]="form" (ngSubmit)="save()" class="premium-form">
        <!-- Titre de l'offre -->
        <div class="form-group mb-4">
          <label for="titre">Titre de l'offre *</label>
          <div class="input-wrapper">
            <i class="ti ti-typography input-icon"></i>
            <input type="text" id="titre" placeholder="Ex: Développeur Full-Stack Angular / Node.js" formControlName="titre"
              [class.is-invalid]="form.get('titre')?.invalid && form.get('titre')?.touched" />
          </div>
          <div class="field-error" *ngIf="form.get('titre')?.invalid && form.get('titre')?.touched">
            Le titre de l'offre est requis.
          </div>
        </div>

        <!-- Description -->
        <div class="form-group mb-4">
          <label for="description">Description détaillée du poste *</label>
          <textarea id="description" class="form-textarea" placeholder="Décrivez les missions principales, la culture d'entreprise, et les responsabilités du poste..." formControlName="description" rows="6"
            [class.is-invalid]="form.get('description')?.invalid && form.get('description')?.touched"></textarea>
          <div class="field-error" *ngIf="form.get('description')?.invalid && form.get('description')?.touched">
            La description du poste est requise.
          </div>
        </div>

        <div class="form-row-grid">
          <!-- Type de contrat -->
          <div class="form-group">
            <label for="typeContrat">Type de contrat *</label>
            <div class="input-wrapper">
              <i class="ti ti-file-text input-icon"></i>
              <select id="typeContrat" formControlName="typeContrat" [class.is-invalid]="form.get('typeContrat')?.invalid && form.get('typeContrat')?.touched">
                <option value="">Sélectionner</option>
                <option value="CDI">CDI (Contrat à Durée Indéterminée)</option>
                <option value="CDD">CDD (Contrat à Durée Déterminée)</option>
                <option value="Freelance">Freelance / Consultant</option>
                <option value="Stage">Stage / PFE / Alternance</option>
                <option value="Intérim">Intérim</option>
              </select>
            </div>
          </div>

          <!-- Localisation -->
          <div class="form-group">
            <label for="localisation">Localisation *</label>
            <div class="input-wrapper">
              <i class="ti ti-map-pin input-icon"></i>
              <input type="text" id="localisation" placeholder="Ex: Tunis, Les Berges du Lac" formControlName="localisation"
                [class.is-invalid]="form.get('localisation')?.invalid && form.get('localisation')?.touched" />
            </div>
          </div>
        </div>

        <div class="form-row-grid mt-2">
          <!-- Salaire -->
          <div class="form-group">
            <label for="salaire">Salaire Mensuel Proposé (DT) *</label>
            <div class="input-wrapper">
              <i class="ti ti-coin input-icon"></i>
              <input type="number" id="salaire" placeholder="Ex: 2500" formControlName="salaire" min="0"
                [class.is-invalid]="form.get('salaire')?.invalid && form.get('salaire')?.touched" />
            </div>
          </div>

          <!-- Expérience Demandée -->
          <div class="form-group">
            <label for="experienceDemandee">Expérience requise (années) *</label>
            <div class="input-wrapper">
              <i class="ti ti-calendar input-icon"></i>
              <input type="number" id="experienceDemandee" placeholder="Ex: 2" formControlName="experienceDemandee" min="0"
                [class.is-invalid]="form.get('experienceDemandee')?.invalid && form.get('experienceDemandee')?.touched" />
            </div>
          </div>
        </div>

        <div class="form-row-grid mt-2">
          <!-- Compétences requises -->
          <div class="form-group">
            <label for="competences">Compétences clés (séparées par des virgules)</label>
            <div class="input-wrapper">
              <i class="ti ti-cpu input-icon"></i>
              <input type="text" id="competences" placeholder="Ex: Angular, Node.js, MongoDB, Docker" formControlName="competences" />
            </div>
          </div>

          <!-- Statut -->
          <div class="form-group">
            <label for="statut">Statut *</label>
            <div class="input-wrapper">
              <i class="ti ti-eye input-icon"></i>
              <select id="statut" formControlName="statut" [class.is-invalid]="form.get('statut')?.invalid && form.get('statut')?.touched">
                <option value="ACTIVE">Active (Publiée)</option>
                <option value="FERMEE">Fermée (Brouillon)</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Boutons d'action -->
        <div class="form-actions mt-4">
          <a routerLink="/entreprise/dashboard" class="btn-cancel">Annuler</a>
          <button type="submit" class="btn-submit" [disabled]="loading()">
            <span *ngIf="!loading()"><i class="ti ti-send"></i> {{ offreId ? 'Sauvegarder les modifications' : 'Publier l\'offre d\'emploi' }}</span>
            <span *ngIf="loading()"><i class="ti ti-loader-2 spin"></i> Traitement...</span>
          </button>
        </div>

        <div class="alert-error-banner mt-3" *ngIf="error()">
          <i class="ti ti-alert-triangle"></i> {{ error() }}
        </div>
      </form>
    </div>
  </div>
</div>
